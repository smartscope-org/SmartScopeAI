[project]
name = "ai-microservice"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "black==21.4b2",
    "celery>=5.4.0",
    "matplotlib>=3.7.5",
    "opencv-python>=4.10.0.84",
    "pydantic>=2.10.5",
    "redis>=5.2.1",
    "scikit-learn>=1.3.2",
    "scipy>=1.10.1",
    "numpy",
    "seaborn>=0.13.2",
    "mrcfile>=1.5.3",
    "ruff>=0.9.2",
    "pytest>=8.3.4",
    "pyyaml>=6.0.2",
    "requests>=2.28.1",
    "tqdm>=4.66.5",
    "pandas",
    "imutils>=0.5.4",
    "tensorboardx>=2.6.2.2",
    "umap-learn>=0.5.7",
    "faiss-gpu-cu12>=1.11.0",
    "pyarrow>=20.0.0",
]

[project.optional-dependencies]
cpu = [
    "torch>=2.6.0",
    "torchvision>=0.21.0",
]
cuda = [
    "torch>=2.6.0",
    "torchvision>=0.21.0",
]

[tool.uv]
conflicts = [
  [
    { extra = "cpu" },
    { extra = "cuda" },
  ],
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu124", extra = "cuda" },
]
torchvision = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu124", extra = "cuda" },
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.setuptools]
packages = ['SmartscopeAI']
